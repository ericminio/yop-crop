<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yop Crop — Flying Farm</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #8ec5e8; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<script>
(function () {
  'use strict';

  // Everything here is in metres, to the geometry worked out for the farm:
  // a 4 m wide ring deck carrying 209 m2 of beds, lifted by five 60,000 m3
  // envelopes standing off 40 m so they do not eclipse the crops. The tethers
  // pull outward on the rim, which a ring takes as pure hoop tension.
  // Nobody lives aboard and nobody walks on it: drones service it, so there
  // are no paths and the whole deck is bed. 69.5 t is beds, irrigation
  // reserve and structure.

  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');

  const R_OUT = 10.32;       // deck outer radius: 209 m2 of bed in a 4 m ring
  const R_IN = 6.32;         // no paths - drones reach every bed from above
  const BALLOON_R = 24.3;    // 60,000 m3 envelope
  const STANDOFF = 40.0;     // balloon ring radius
  const LIFT_H = 60.0;       // balloon height above the deck
  const BALLOONS = 5;
  // the viewer looks along +x+y, so 45deg is nearest; sit the ring's gap there
  const RING_PHASE = (9 * Math.PI) / 180;
  const SUBDIV = 4;          // arc smoothness per degree block

  // bed area in m2 and bed depth in m, from the crop plan
  const CROPS = [
    { name: 'kale',      area:   6, depth: 0.25, top: [ 61, 107,  79], side: [ 92,  74,  56] },
    { name: 'carrot',    area:   4, depth: 0.35, top: [217, 139,  58], side: [ 92,  74,  56] },
    { name: 'potato',    area: 146, depth: 0.45, top: [ 95, 141,  62], side: [ 92,  74,  56] },
    { name: 'sunflower', area:  40, depth: 0.60, top: [227, 194,  74], side: [ 92,  74,  56] },
    { name: 'tomato',    area:  11, depth: 0.45, top: [192,  80,  64], side: [ 92,  74,  56] },
    { name: 'onion',     area:   2, depth: 0.25, top: [185, 167, 196], side: [ 92,  74,  56] }
  ];
  const TOTAL_AREA = CROPS.reduce(function (s, c) { return s + c.area; }, 0);

  const ROCK_DARK = [70, 58, 48];
  const BALLOON_COLOR = [226, 196, 74];
  const LIGHT = normalize([-0.55, -0.30, 0.95]);
  const VIEW = normalize([1, 1, 1]);

  function normalize(v) {
    const m = Math.hypot(v[0], v[1], v[2]) || 1;
    return [v[0] / m, v[1] / m, v[2] / m];
  }

  const COS30 = Math.cos(Math.PI / 6);
  function iso(p) { return { x: (p[0] - p[1]) * COS30, y: (p[0] + p[1]) * 0.5 - p[2] }; }
  function depth(p) { return p[0] + p[1] + p[2]; }
  function cyl(radius, angle, z) {
    return [radius * Math.cos(angle), radius * Math.sin(angle), z];
  }

  function faceNormal(q) {
    const a = [q[1][0] - q[0][0], q[1][1] - q[0][1], q[1][2] - q[0][2]];
    const b = [q[2][0] - q[1][0], q[2][1] - q[1][1], q[2][2] - q[1][2]];
    return normalize([a[1] * b[2] - a[2] * b[1],
                      a[2] * b[0] - a[0] * b[2],
                      a[0] * b[1] - a[1] * b[0]]);
  }
  function facesViewer(n) {
    return n[0] * VIEW[0] + n[1] * VIEW[1] + n[2] * VIEW[2] > 0.001;
  }
  function shade(rgb, n) {
    const lam = Math.max(0, n[0] * LIGHT[0] + n[1] * LIGHT[1] + n[2] * LIGHT[2]);
    const k = 0.52 + 0.48 * lam;
    return 'rgb(' + Math.round(rgb[0] * k) + ',' + Math.round(rgb[1] * k) + ',' +
                    Math.round(rgb[2] * k) + ')';
  }

  // ------------------------------------------------------------- scene build
  function pushQuad(items, quad, rgb) {
    const n = faceNormal(quad);
    if (!facesViewer(n)) return;
    let d = 0;
    for (let i = 0; i < quad.length; i++) d += depth(quad[i]);
    items.push({ kind: 'quad', depth: d / quad.length, quad: quad, fill: shade(rgb, n) });
  }

  // One identical segment per tether. Contiguous arcs put the centre of mass
  // 0.43 m off the axis, because a 60 cm sunflower bed weighs 2.4x what a 25 cm
  // onion bed does per metre of arc. Interleaving costs nothing and cancels it.
  function sectors() {
    const out = [];
    let a = -Math.PI / 2;
    for (let k = 0; k < BALLOONS; k++) {
      for (let i = 0; i < CROPS.length; i++) {
        const span = (CROPS[i].area / BALLOONS / TOTAL_AREA) * Math.PI * 2;
        out.push({ crop: CROPS[i], a0: a, a1: a + span });
        a += span;
      }
    }
    return out;
  }
  const SECTORS = sectors();

  function buildScene(bob) {
    const items = [];

    // deck: tops all level at z = bob, each bed hanging down to its own depth
    for (let s = 0; s < SECTORS.length; s++) {
      const sec = SECTORS[s];
      const zTop = bob;
      const zBot = bob - sec.crop.depth;
      const steps = Math.max(2, Math.ceil((sec.a1 - sec.a0) / (Math.PI / 180) / SUBDIV));
      const step = (sec.a1 - sec.a0) / steps;

      for (let k = 0; k < steps; k++) {
        const a0 = sec.a0 + k * step, a1 = a0 + step;
        pushQuad(items, [cyl(R_IN, a0, zTop), cyl(R_OUT, a0, zTop),
                         cyl(R_OUT, a1, zTop), cyl(R_IN, a1, zTop)], sec.crop.top);
        pushQuad(items, [cyl(R_OUT, a0, zTop), cyl(R_OUT, a0, zBot),
                         cyl(R_OUT, a1, zBot), cyl(R_OUT, a1, zTop)], sec.crop.side);
        pushQuad(items, [cyl(R_IN, a0, zTop), cyl(R_IN, a1, zTop),
                         cyl(R_IN, a1, zBot), cyl(R_IN, a0, zBot)], ROCK_DARK);
      }
      // the step between neighbouring beds of different depth
      const next = SECTORS[(s + 1) % SECTORS.length];
      if (next.crop.depth !== sec.crop.depth) {
        const deeper = next.crop.depth > sec.crop.depth ? next.crop : sec.crop;
        pushQuad(items, [cyl(R_IN, sec.a1, zTop), cyl(R_OUT, sec.a1, zTop),
                         cyl(R_OUT, sec.a1, bob - deeper.depth),
                         cyl(R_IN, sec.a1, bob - deeper.depth)], ROCK_DARK);
      }
    }

    // balloons, standing off so their shadows miss the beds
    for (let i = 0; i < BALLOONS; i++) {
      const a = RING_PHASE + (i / BALLOONS) * Math.PI * 2;
      const centre = cyl(STANDOFF, a, LIFT_H + bob);
      const fan = [];
      for (let t = -1; t <= 1; t++) {
        fan.push(cyl(R_OUT, a + t * (Math.PI / BALLOONS) * 0.62, bob));
      }
      items.push({ kind: 'balloon', depth: depth(centre), centre: centre, fan: fan });
    }

    // rim cable, as depth-sorted segments so front balloons occlude it correctly
    const SEG = 96;
    for (let i = 0; i < SEG; i++) {
      const p0 = cyl(R_OUT, (i / SEG) * Math.PI * 2, bob);
      const p1 = cyl(R_OUT, ((i + 1) / SEG) * Math.PI * 2, bob);
      items.push({ kind: 'cable', depth: (depth(p0) + depth(p1)) / 2, a: p0, b: p1 });
    }

    items.sort(function (a, b) { return a.depth - b.depth; });
    return items;
  }

  // --------------------------------------------------------------- rendering
  const FIT = (function () {
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    function probe(p, pad) {
      const s = iso(p);
      minX = Math.min(minX, s.x - pad); maxX = Math.max(maxX, s.x + pad);
      minY = Math.min(minY, s.y - pad); maxY = Math.max(maxY, s.y + pad);
    }
    for (let i = 0; i < 360; i++) {
      const a = (i / 360) * Math.PI * 2;
      probe(cyl(R_OUT, a, -0.6), 0);
      probe(cyl(STANDOFF, a, LIFT_H), BALLOON_R * 1.95);
    }
    return { w: maxX - minX, h: maxY - minY, cx: (minX + maxX) / 2, cy: (minY + maxY) / 2 };
  })();

  let scale = 1, originX = 0, originY = 0;
  function project(p) {
    const s = iso(p);
    return { x: originX + (s.x - FIT.cx) * scale, y: originY + (s.y - FIT.cy) * scale };
  }

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const w = window.innerWidth, h = window.innerHeight;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    scale = Math.min(w / (FIT.w * 1.05), h / (FIT.h * 1.05));
    originX = w / 2;
    originY = h / 2;
  }

  function drawSky(w, h) {
    const sky = ctx.createLinearGradient(0, 0, 0, h);
    sky.addColorStop(0, '#3f93d2');
    sky.addColorStop(0.55, '#9fd0ee');
    sky.addColorStop(1, '#dff0f7');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    const clouds = [[0.08, 0.72, 1.0], [0.90, 0.80, 0.8], [0.50, 0.93, 1.2], [0.22, 0.86, 0.7]];
    for (let i = 0; i < clouds.length; i++) {
      puff(clouds[i][0] * w, clouds[i][1] * h, 40 * clouds[i][2] * Math.min(1, w / 900));
    }
  }
  function puff(x, y, r) {
    ctx.beginPath();
    ctx.ellipse(x, y, r * 1.5, r * 0.55, 0, 0, Math.PI * 2);
    ctx.ellipse(x - r * 0.7, y + r * 0.12, r * 0.75, r * 0.42, 0, 0, Math.PI * 2);
    ctx.ellipse(x + r * 0.6, y + r * 0.18, r * 0.85, r * 0.46, 0, 0, Math.PI * 2);
    ctx.ellipse(x + r * 0.1, y - r * 0.32, r * 0.8, r * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawQuad(item) {
    const q = item.quad;
    ctx.beginPath();
    const p0 = project(q[0]);
    ctx.moveTo(p0.x, p0.y);
    for (let i = 1; i < q.length; i++) {
      const p = project(q[i]);
      ctx.lineTo(p.x, p.y);
    }
    ctx.closePath();
    ctx.fillStyle = item.fill;
    ctx.fill();
    ctx.strokeStyle = item.fill;
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  function envelopePath(c, r) {
    ctx.beginPath();
    ctx.moveTo(c.x, c.y + r * 1.5);
    ctx.bezierCurveTo(c.x - r * 0.72, c.y + r * 0.8, c.x - r, c.y + r * 0.22, c.x - r, c.y - r * 0.1);
    ctx.bezierCurveTo(c.x - r, c.y - r * 1.15, c.x + r, c.y - r * 1.15, c.x + r, c.y - r * 0.1);
    ctx.bezierCurveTo(c.x + r, c.y + r * 0.22, c.x + r * 0.72, c.y + r * 0.8, c.x, c.y + r * 1.5);
    ctx.closePath();
  }

  function drawBalloon(item) {
    const c = project(item.centre);
    const r = BALLOON_R * scale;
    const rgb = BALLOON_COLOR;
    const body = 'rgb(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ')';
    const light = 'rgb(255,255,144)';

    const loadY = c.y + r * 1.5 + r * 0.20;
    const loadW = r * 0.30;

    // tethers fanning down and inward to the deck rim
    ctx.strokeStyle = 'rgba(50,44,38,0.75)';
    ctx.lineWidth = Math.max(1, r * 0.016);
    ctx.beginPath();
    for (let i = 0; i < item.fan.length; i++) {
      const a = project(item.fan[i]);
      ctx.moveTo(c.x, loadY + r * 0.16);
      ctx.lineTo(a.x, a.y);
    }
    ctx.stroke();

    // suspension ropes and the burner frame
    ctx.beginPath();
    ctx.moveTo(c.x - r * 0.24, c.y + r * 1.28); ctx.lineTo(c.x - loadW * 0.5, loadY);
    ctx.moveTo(c.x + r * 0.24, c.y + r * 1.28); ctx.lineTo(c.x + loadW * 0.5, loadY);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(c.x - loadW * 0.5, loadY);
    ctx.lineTo(c.x + loadW * 0.5, loadY);
    ctx.lineTo(c.x + loadW * 0.4, loadY + r * 0.16);
    ctx.lineTo(c.x - loadW * 0.4, loadY + r * 0.16);
    ctx.closePath();
    ctx.fillStyle = '#8d6234';
    ctx.fill();
    ctx.strokeStyle = '#5d3f1f';
    ctx.stroke();

    ctx.save();
    envelopePath(c, r);
    ctx.fillStyle = body;
    ctx.fill();
    ctx.clip();
    ctx.fillStyle = light;
    for (let k = -2; k <= 2; k += 2) {
      ctx.beginPath();
      ctx.ellipse(c.x + k * r * 0.42, c.y, r * 0.15, r * 1.4, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    const g = ctx.createRadialGradient(c.x - r * 0.4, c.y - r * 0.55, r * 0.1, c.x, c.y, r * 1.7);
    g.addColorStop(0, 'rgba(255,255,255,0.45)');
    g.addColorStop(0.45, 'rgba(255,255,255,0)');
    g.addColorStop(1, 'rgba(0,0,0,0.38)');
    ctx.fillStyle = g;
    ctx.fillRect(c.x - r * 1.2, c.y - r * 1.6, r * 2.4, r * 3.4);
    ctx.restore();

    envelopePath(c, r);
    ctx.strokeStyle = 'rgba(0,0,0,0.22)';
    ctx.lineWidth = Math.max(1, r * 0.015);
    ctx.stroke();
  }

  // the rim cable that turns the tethers' outward pull into hoop tension
  function drawCable(item) {
    const a = project(item.a), b = project(item.b);
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.strokeStyle = 'rgba(40,36,32,0.6)';
    ctx.lineWidth = Math.max(1.2, 0.14 * scale);
    ctx.lineCap = 'round';
    ctx.stroke();
  }

  function drawLegend(w, h) {
    const pad = Math.max(12, Math.min(20, w * 0.02));
    const line = Math.max(13, Math.min(17, h * 0.022));
    ctx.font = Math.round(line * 0.72) + 'px system-ui, -apple-system, sans-serif';
    ctx.textBaseline = 'middle';
    let y = pad + line * 0.5;
    ctx.fillStyle = 'rgba(20,40,55,0.85)';
    ctx.font = '600 ' + Math.round(line * 0.8) + 'px system-ui, -apple-system, sans-serif';
    ctx.fillText('209 m² of beds · 69.5 t aloft', pad, y);
    y += line * 1.25;
    ctx.font = Math.round(line * 0.72) + 'px system-ui, -apple-system, sans-serif';
    for (let i = 0; i < CROPS.length; i++) {
      const c = CROPS[i];
      ctx.fillStyle = 'rgb(' + c.top[0] + ',' + c.top[1] + ',' + c.top[2] + ')';
      ctx.fillRect(pad, y - line * 0.28, line * 0.56, line * 0.56);
      ctx.fillStyle = 'rgba(20,40,55,0.8)';
      ctx.fillText(c.name + '  ' + c.area + ' m²  ·  ' + Math.round(c.depth * 100) + ' cm deep',
                   pad + line * 0.9, y);
      y += line;
    }
    y += line * 0.4;
    ctx.fillStyle = 'rgba(20,40,55,0.6)';
    ctx.fillText('5 × 60,000 m³ · 40 m standoff, 60 m up · tethers 26° off vertical', pad, y);
    y += line;
    ctx.fillText('each crop split across 5 identical segments to balance the ring', pad, y);
  }

  function frame(now) {
    const w = window.innerWidth, h = window.innerHeight;
    const bob = Math.sin(now / 2400) * 0.35;
    drawSky(w, h);
    const items = buildScene(bob);
    for (let i = 0; i < items.length; i++) {
      const k = items[i].kind;
      if (k === 'quad') drawQuad(items[i]);
      else if (k === 'cable') drawCable(items[i]);
      else drawBalloon(items[i]);
    }
    drawLegend(w, h);
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
